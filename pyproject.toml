[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vida"
version = "0.2.0a0"
description = "VIDA: Vida Artificial, Identidad y Desarrollo de Agentes. Simulador multiagente reproducible."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Oziel Atlahi Montoya Mares" }]
dependencies = [
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
dashboard = [
    "streamlit>=1.35",
    "plotly>=5.20",
    "pandas>=2.0",
]
llm = [
    "anthropic>=1.0",
]

[project.scripts]
vida = "vida.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
